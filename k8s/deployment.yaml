apiVersion: v1
kind: Namespace
metadata:
  name: ea-nn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ea-nn-simulation
  namespace: ea-nn
  labels:
    app: ea-nn
    component: simulation
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ea-nn
      component: simulation
  template:
    metadata:
      labels:
        app: ea-nn
        component: simulation
    spec:
      containers:
      - name: ea-nn
        image: ea-nn:latest
        ports:
        - containerPort: 5000
        env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility"
        - name: FLASK_ENV
          value: "production"
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
            nvidia.com/gpu: 1
          limits:
            memory: "8Gi"
            cpu: "4000m"
            nvidia.com/gpu: 1
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 30
      nodeSelector:
        accelerator: nvidia-tesla-v100  # Adjust based on your GPU nodes
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
---
apiVersion: v1
kind: Service
metadata:
  name: ea-nn-service
  namespace: ea-nn
spec:
  selector:
    app: ea-nn
    component: simulation
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ea-nn-ingress
  namespace: ea-nn
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - ea-nn.yourdomain.com
    secretName: ea-nn-tls
  rules:
  - host: ea-nn.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ea-nn-service
            port:
              number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ea-nn-hpa
  namespace: ea-nn
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ea-nn-simulation
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
