services:
  # Development service with GPU
  ea-nn-dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: ea-nn-dev
    ports:
      - "5000:5000"
      - "8888:8888"
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,display
      - PYTHONPATH=/workspace
    networks:
      - ea-nn-network
    profiles:
      - development
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Development service CPU-only (fallback)
  ea-nn-dev-cpu:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: ea-nn-dev-cpu
    ports:
      - "5000:5000"
      - "8888:8888"
    volumes:
      - .:/workspace
    environment:
      - PYTHONPATH=/workspace
    networks:
      - ea-nn-network
    profiles:
      - development-cpu

  # Production service with GPU
  ea-nn-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ea-nn-simulation
    ports:
      - "80:5000"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - FLASK_ENV=production
    restart: unless-stopped
    networks:
      - ea-nn-network
    profiles:
      - production
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Production service CPU-only (fallback)
  ea-nn-prod-cpu:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ea-nn-simulation-cpu
    ports:
      - "80:5000"
    environment:
      - FLASK_ENV=production
    restart: unless-stopped
    networks:
      - ea-nn-network
    profiles:
      - production-cpu

  # GPU monitoring service
  ea-nn-monitor:
    image: nvidia/dcgm-exporter:3.1.8-3.1.5-ubuntu22.04
    container_name: ea-nn-monitor
    ports:
      - "9400:9400"
    runtime: nvidia
    cap_add:
      - SYS_ADMIN
    networks:
      - ea-nn-network
    profiles:
      - monitoring

networks:
  ea-nn-network:
    driver: bridge

volumes:
  ea-nn-data:
    driver: local
