services:
  # Development service (auto-detects GPU)
  ea-nn-dev:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: ea-nn-dev
    ports:
      - "5000:5000"
      - "8888:8888"
    volumes:
      - .:/workspace
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,display
      - PYTHONPATH=/workspace
    networks:
      - ea-nn-network
    profiles:
      - development

  # Production service (auto-detects GPU)  
  ea-nn-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ea-nn-simulation
    ports:
      - "80:5000"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - FLASK_ENV=production
    restart: unless-stopped
    networks:
      - ea-nn-network
    profiles:
      - production

networks:
  ea-nn-network:
    driver: bridge
